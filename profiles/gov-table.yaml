# 政务附表（gov-table）
# ---------------------------------------------------------------
# 适用：党政机关公文的附表附件、政府信息公开表、部门预算决算公开表、
#       政务统计公报表格、政务审批表单。
#
# 规范依据：GB/T 9704-2012《党政机关公文格式》公文用纸与版心规定
# （A4、天头 37mm、订口 28mm、版心 156mm×225mm），附件与正文一体装订、
# 页码连续编排。政务表格随公文正文用仿宋，不另设字体。
#
# 关键约束：
#   - 字体随公文正文用仿宋（非黑体、非宋体），这是公文与商务表最大区别
#   - 表头底纹用浅灰不用深蓝，公文印刷以黑白为主
#   - 表格宽度不超过版心 156mm，超宽须缩短列内容或改横排
#   - 表题含表号，格式「附表1」或「表1」，居中标于表上方
# ---------------------------------------------------------------

profile:
  name: gov-table
  title: 政务附表
  standard: GB/T 9704-2012
  source: 党政机关公文格式及政务公开表格通行做法
  note: 公文附表附件、政府信息公开表、预算决算公开表、政务审批表单

font:
  name: 仿宋
  western: Times New Roman
  data_size: 10.5
  data_color: "000000"
  note_color: "000000"

header:
  fill: "D9D9D9"
  font_color: "000000"
  font_name: 黑体
  size: 10.5
  bold: false
  align: center
  valign: center
  wrap: true
  border_style: thin
  border_color: "000000"

title:
  fill: null
  font_color: "000000"
  size: 14
  bold: true
  align: center
  merge: true
  border: false

note:
  size: 9
  color: "000000"
  align: left
  merge: true

body:
  align: auto
  border_style: thin
  border_color: "000000"
  zebra: false
  zebra_color: null
  zebra_start: 2
  total_row_bold: false

rules:
  three_line: false
  top_pt: 1.5
  header_pt: 1.0
  bottom_pt: 1.5
  vertical: true

row_height:
  min_data: 20
  title_base: 24
  title_line: 20
  note_base: 18
  head_base: 24
  line: 15.0

col_width:
  min: 6
  max: 40
  pad: 2
  head_factor: 1.5
  text_cap: 40

freeze:
  enabled: auto
  min_rows: 20
  anchor: auto

print:
  orientation: landscape
  paper: A4
  title_rows: auto
  margin_cm: 2.8
  gridlines: false
